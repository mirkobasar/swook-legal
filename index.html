<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swook — Legales</title>
  <style>
    :root { --primary: #4A6984; --text: #1A1A1A; --muted: #555; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text); line-height: 1.6; margin: 0;
      padding: 40px 20px; max-width: 720px; margin: 0 auto;
    }
    h1 { color: var(--primary); font-size: 28px; }
    .brand { font-size: 40px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .sub { color: var(--muted); margin-bottom: 32px; }
    a.card {
      display: block; text-decoration: none; color: var(--text);
      border: 1px solid #e0e0e0; border-radius: 14px; padding: 20px 24px;
      margin-bottom: 16px; transition: border-color .15s;
    }
    a.card:hover { border-color: var(--primary); }
    a.card strong { color: var(--primary); font-size: 18px; }
    a.card span { display: block; color: var(--muted); margin-top: 4px; font-size: 14px; }
    footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
    footer a { color: var(--primary); }
  </style>
</head>
<body>
  <div class="brand">Swook</div>
  <p class="sub">Intercambiá, regalá y encontrá libros con personas cerca tuyo.</p>

  <a class="card" href="terminos.html">
    <strong>Términos y Condiciones</strong>
    <span>Reglas de uso, responsabilidades y política de contenido.</span>
  </a>
  <a class="card" href="privacidad.html">
    <strong>Política de Privacidad</strong>
    <span>Qué datos tratamos, para qué, y tus derechos.</span>
  </a>

  <footer>
    Contacto: <a href="mailto:swook.support@gmail.com">swook.support@gmail.com</a>
  </footer>
</body>
</html>
